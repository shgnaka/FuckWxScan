name: Android build

on:
  push:
    branches:
      - feature/system-screenshot-qr-choice
      - chore/screenshot-qr-diagnostic-logging
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle
      - name: Run unit tests and build debug APK
        run: bash ./gradlew testDebugUnitTest assembleDebug --stacktrace


      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-qr-choice-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
