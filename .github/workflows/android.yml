name: Android build

on:
  push:
    branches:
      - feature/system-screenshot-qr-choice
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle
      - name: Run unit tests and build debug APK
        run: bash ./gradlew testDebugUnitTest assembleDebug --stacktrace
